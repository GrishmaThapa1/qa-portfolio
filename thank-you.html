
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message Received | QA Portfolio</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8ff;
            color: #243047;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .thank-you-card {
            background: #ffffff;
            max-width: 540px;
            width: 100%;
            padding: 50px 35px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(30, 64, 120, 0.10);
        }

        .success-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e4f7ed;
            color: #168653;
            font-size: 34px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 16px;
            color: #173b70;
        }

        p {
            font-size: 16px;
            line-height: 1.8;
            color: #64748b;
            margin-bottom: 28px;
        }

        .home-button {
            display: inline-block;
            padding: 13px 25px;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .home-button:hover {
            background: #1d4ed8;
        }

        .home-button i {
            margin-right: 8px;
        }

        .footer-text {
            font-size: 13px;
            margin-top: 28px;
            margin-bottom: 0;
        }

        @media (max-width: 480px) {
            .thank-you-card {
                padding: 38px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="thank-you-card">

        <div class="success-icon">
            <i class="fa-solid fa-check"></i>
        </div>

        <h1>Thank You for Reaching Out!</h1>

        <p>
            Your message has been submitted successfully.
        </p>

        

        
    </main>
</body>
</html>
